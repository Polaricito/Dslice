name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check release signing secrets
        id: signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$KEYSTORE" ] && [ -z "$KEYSTORE_PASSWORD" ] && \
               [ -z "$KEY_ALIAS" ] && [ -z "$KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. A signed debug APK will be uploaded instead of an unsigned release APK."
            echo "Release signing secrets are not configured. A signed debug APK is uploaded instead; unsigned release APKs cannot be installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Configure all four signing secrets (KEYSTORE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD), or remove all four to build an unsigned APK."
            exit 1
          fi

      - name: Configure release signing
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'KEYSTORE_FILE=../keystore.jks\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties
          printf '%s' "$KEYSTORE" | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Dslice APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ steps.signing.outputs.configured }}" != "true" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Upload Dslice debug APK
        if: github.event_name == 'pull_request' || steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Dslice-Debug-APK
          path: app/build/outputs/apk/debug/Dslice_*.apk
          if-no-files-found: error

      - name: Upload signed Dslice release APK
        if: github.event_name != 'pull_request' && steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Dslice-Release-APK
          path: app/build/outputs/apk/release/Dslice_*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/Dslice_*.apk
