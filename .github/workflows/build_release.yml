name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Accept Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1" "ndk;28.2.13676358" > /dev/null 2>&1 || true

      - name: 4. Patch Package Name & Config
        run: |
          sed -i -E 's/applicationId\s*=\s*".*?"/applicationId = "df.D10slice"/' app/build.gradle.kts || true
          sed -i -E 's/namespace\s*=\s*".*?"/namespace = "df.D10slice"/' app/build.gradle.kts || true

      - name: 5. Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon

      - name: 6. Verify Gradle-signed APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APK=$(find app/build/outputs/apk/release -name "Dslice_*.apk" | head -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: 7. Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Dslice_Signed_APK
          path: app/build/outputs/apk/release/Dslice_*.apk
          if-no-files-found: error
